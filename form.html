<!-- Ukázkový kontaktní formulář — zkopíruj do klientského webu.
     Uprav FORM_ENDPOINT na URL svého nasazeného /api/contact. -->
<form id="contact-form" novalidate>
  <div>
    <label for="cf-name">Jméno *</label>
    <input type="text" id="cf-name" name="name" required>
  </div>

  <div>
    <label for="cf-email">E-mail *</label>
    <input type="email" id="cf-email" name="email" required>
  </div>

  <div>
    <label for="cf-phone">Telefon</label>
    <input type="tel" id="cf-phone" name="phone">
  </div>

  <div>
    <label for="cf-message">Zpráva *</label>
    <textarea id="cf-message" name="message" rows="5" required></textarea>
  </div>

  <!-- Honeypot — skryté pole, musí zůstat prázdné -->
  <div style="position:absolute;left:-9999px" aria-hidden="true">
    <label for="cf-website">Nevyplňujte toto pole</label>
    <input type="text" id="cf-website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit">Odeslat poptávku</button>
  <p id="cf-status" role="status" aria-live="polite"></p>
</form>

<script>
(function () {
  var FORM_ENDPOINT = 'https://contact-form-drab-six.vercel.app/api/contact';

  var form = document.getElementById('contact-form');
  var status = document.getElementById('cf-status');
  var btn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = '';
    status.className = '';
    btn.disabled = true;
    btn.textContent = 'Odesílám...';

    var data = {
      name: form.name.value,
      email: form.email.value,
      phone: form.phone.value,
      message: form.message.value,
      website: form.website.value // honeypot
    };

    fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
      .then(function (res) { return res.json().then(function (json) { return { ok: res.ok, json: json }; }); })
      .then(function (result) {
        if (result.ok && result.json.ok) {
          status.textContent = 'Děkujeme, zpráva byla odeslána.';
          status.className = 'cf-success';
          form.reset();
        } else {
          status.textContent = (result.json && result.json.error) || 'Něco se pokazilo, zkuste to prosím znovu.';
          status.className = 'cf-error';
        }
      })
      .catch(function () {
        status.textContent = 'Nepodařilo se odeslat. Zkontrolujte připojení a zkuste to znovu.';
        status.className = 'cf-error';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Odeslat poptávku';
      });
  });
})();
</script>

<style>
  #contact-form label { display: block; font-weight: 600; margin-bottom: 4px; }
  #contact-form input, #contact-form textarea { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
  .cf-success { color: green; }
  .cf-error { color: #c0392b; }
</style>
